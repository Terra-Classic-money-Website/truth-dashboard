name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-branch"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: Publish built site to gh-pages
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          publish_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$publish_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$publish_dir" origin/gh-pages
          git -C "$publish_dir" rm -r --ignore-unmatch . >/dev/null
          cp -R site/dist/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No published site changes."
            exit 0
          fi

          git -C "$publish_dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy ${DEPLOY_SHA}"
          git -C "$publish_dir" push origin HEAD:gh-pages
